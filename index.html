<script>
  function mostrarError(texto) {
    var el = document.getElementById('fallback-error');
    el.style.display = 'block';
    el.textContent += texto + "\n\n";
  }
  window.addEventListener('error', function (e) {
    mostrarError('ERROR: ' + e.message + ' (línea ' + e.lineno + ', columna ' + e.colno + ')' +
      (e.error && e.error.stack ? '\n' + e.error.stack : ''));
  });
  window.addEventListener('unhandledrejection', function (e) {
    mostrarError('PROMESA RECHAZADA: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
  });
  setTimeout(function () {
    var root = document.getElementById('root');
    if (root && root.innerHTML.trim() === '') {
      mostrarError('AVISO: han pasado 5 segundos y la app no se dibujó en pantalla (root sigue vacío), pero no se detectó ningún error de JavaScript.');
    }
  }, 5000);
</script>

  return (v || "").replace(/\D/g, "").slice(-10);

    nombre,
    esLider: !!esLider,
